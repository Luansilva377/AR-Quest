<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR quest</title>
    <link rel="shortcut icon" href="https://i.ibb.co/fYnwC9bH/Screenshot-20251121-204255-Chrome-removebg-preview.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsividade/responsividede.css">
    <script defer src="./js/script.js"></script>
</head>
<body">
    <header class="cabecalho">
        <div class="modelo-pergunta">
            <h1>conhecimentos Locais</h1>
        </div>
        <div class="titulo">
            <img src="https://i.ibb.co/fYnwC9bH/Screenshot-20251121-204255-Chrome-removebg-preview.png" alt="AR-quest logo">
        </div>
        <div class="quantidade-tentativas">
            <p>Tentativas: </p>
            <p>2 /</p>
            <p class="tentativas">0</p>
        </div>
    </header>
    <main class="container">
        <section class="pergunta-enunciado">
            <p>Em que ano a cidade de Salvador foi fundada?</p>
        </section>
        <section class="opcoes-resposta">
            <ul>
                <li class="op0">1500</li>
                <li class="op1 resposta">1549</li>
                <li class="op2">1601</li>
                <li class="op3">1700</li>
            </ul>
        </section>
        <section class="explicacao-resposta popup" id="popup">
            <p class="explicacao-texto"></p>
            <p class="resposta-correta"></p>
             <button id="fecharPopup">x</button>
        </section>
    </main>
</body>
</html>
